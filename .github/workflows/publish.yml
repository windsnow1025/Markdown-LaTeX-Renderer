name: Publish Package

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Copy README.md
        run: cp ../../README.md .
        working-directory: packages/markdown-latex-renderer
      - run: pnpm install --frozen-lockfile --filter markdown-latex-renderer...
      - run: pnpm run build
        working-directory: packages/markdown-latex-renderer
      - run: npm install -g npm@latest # OIDC
      - run: pnpm publish --access public --no-git-checks
        working-directory: packages/markdown-latex-renderer
