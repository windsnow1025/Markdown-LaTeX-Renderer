# https://docs.npmjs.com/trusted-publishers

name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Copy README.md
        run: cp ../../README.md .
        working-directory: packages/markdown-latex-renderer
      - run: pnpm install --frozen-lockfile --filter markdown-latex-renderer...
      - run: pnpm run build
        working-directory: packages/markdown-latex-renderer
      - run: npm install -g npm@latest # OIDC
      - name: Publish
        working-directory: packages/markdown-latex-renderer
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-alpha*) TAG="alpha" ;;
            *-beta*)  TAG="beta" ;;
            *-rc*)    TAG="rc" ;;
            *)        TAG="latest" ;;
          esac
          pnpm publish --access public --no-git-checks --tag $TAG
